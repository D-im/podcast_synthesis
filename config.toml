port = 8765
daily_cap_usd = 5.0
token_limit = 150000

[providers]
downloader = "yt-dlp"    # or "fake"
transcriber = "fake"     # real: "assemblyai"
summarizer = "fake"      # real: "anthropic"
verifier = "fake"        # real: "openai"

[ytdlp]
js_runtime = "node"   # "node" or "deno"

[models]
transcriber = "universal-3.5-pro"
summarizer = "claude-sonnet-5-5"
verifier = "gpt-6.1-sol"

[assemblyai]
speaker_labels = true
poll_interval_seconds = 5
max_wait_minutes = 180

[anthropic]
max_output_tokens = 4096
map_chunk_tokens = 60000
map_output_tokens = 4096

[pricing]
transcription_usd_per_hour = 0.23   # includes speaker labels
summarizer_input_usd_per_million = 2.0
summarizer_output_usd_per_million = 10.0

[fidelity]
accuracy_threshold = 0.9
coverage_threshold = 0.75
