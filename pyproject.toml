[project]
name = "podcast-synthesis"
version = "0.1.0"
description = "Local podcast synthesis app"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn",
    "jinja2",
    "python-dotenv",
    "yt-dlp[default]==2026.8.19",
    "assemblyai==1.6.1",
    "anthropic==1.10.0",
    "openai==3.22.1",
]

[dependency-groups]
dev = ["pytest", "httpx"]

[project.scripts]
podcast-synthesis = "app.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["network: real-network test, runs only with RUN_NETWORK_TESTS=1"]
