[project]
name = "podcast-synthesis"
version = "0.1.0"
description = "Local podcast synthesis app"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn",
    "jinja2",
    "python-dotenv",
]

[dependency-groups]
dev = ["pytest", "httpx"]

[project.scripts]
podcast-synthesis = "app.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
