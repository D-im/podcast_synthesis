{% extends "base.html" %}
{% block content %}<h1>Podcast Synthesis</h1>
<form method="post" action="/submit">
<label>YouTube link <input type="text" name="url" value="{{ url or '' }}" size="60"></label>
<button type="submit">Submit</button>
</form>
{% if error %}<p role="alert">{{ error }}</p>{% endif %}
{% if warnings %}
<h2>Startup warnings</h2>
<ul>
{% for w in warnings %}<li>{{ w }}</li>
{% endfor %}</ul>
{% else %}
<p>All prerequisites present.</p>
{% endif %}
{% include "_library.html" %}
{% endblock %}
