{% extends "base.html" %}
{% block title %}Transcript {{ video_id }}{% endblock %}
{% block content %}<p><a href="/episodes/{{ video_id }}">Back to episode</a></p>
<h1>Transcript: {{ title }}</h1>
{% for l in lines %}<p>[{{ l.time }}] {% if l.speaker %}{{ l.speaker }}: {% endif %}{{ l.text }}</p>
{% endfor %}{% endblock %}
